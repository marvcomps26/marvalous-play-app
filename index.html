<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b2a86">

  <title>Marvalous</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      background:
        linear-gradient(
          180deg,
          #51227d 0%,
          #6b32a0 48%,
          #51227d 100%
        );
      padding-bottom: 100px;
      position: relative;
    }

    /* TOP */

    .top {
      padding: 38px 24px 10px;
      text-align: center;
    }

    .status-box {
      background: #050505;
      color: white;
      border: 3px solid white;
      border-radius: 18px;
      padding: 18px 10px;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 5px 12px rgba(0,0,0,.25);
    }

    /* LOGO AREA */

    .logo-area {
      min-height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
    }

    .logo {
      max-width: 270px;
      max-height: 160px;
      object-fit: contain;
      display: none;
    }

    .temporary-logo {
      color: white;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 3px 8px rgba(0,0,0,.35);
    }

    .temporary-logo span {
      display: block;
      font-size: 15px;
      letter-spacing: 5px;
      margin-top: 5px;
      font-weight: 600;
    }

    .rules {
      text-align: center;
      color: rgba(255,255,255,.9);
      margin: -15px 0 28px;
      font-size: 16px;
    }

    /* MENU GRID */

    .menu {
      padding: 0 22px 30px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .menu-button {
      min-height: 140px;
      background: white;
      border: none;
      border-radius: 17px;
      color: #32154d;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 7px;
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .menu-button:active {
      transform: scale(.97);
    }

    .icon {
      font-size: 38px;
      line-height: 1;
      margin-bottom: 13px;
    }

    .favourites {
      background: #080808;
      color: white;
    }

    .favourites .icon {
      color: #e44b61;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      height: 82px;
      background: #32154d;
      border-top: 1px solid rgba(255,255,255,.2);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      z-index: 100;
    }

    .nav-button {
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 32px;
    }

    .nav-button.home {
      color: #c89cff;
    }

    @media (max-width: 390px) {
      .menu {
        gap: 11px;
        padding-left: 14px;
        padding-right: 14px;
      }

      .menu-button {
        min-height: 125px;
        font-size: 14px;
      }

      .icon {
        font-size: 32px;
      }

      .logo-area {
        min-height: 250px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="status-box">
      Welcome to Marvalous
    </div>
  </div>

  <div class="logo-area">

    <!-- We will replace this with the proper Marvalous logo -->
    <div class="temporary-logo">
      MARVALOUS
      <span>COMPETITIONS</span>
    </div>

    <img
      class="logo"
      src="logo.png"
      alt="Marvalous Competitions"
    >

  </div>

  <div class="rules">
    Official Rules
  </div>

  <div class="menu">

    <a class="menu-button" href="#">
      <div class="icon">🎟️</div>
      Competitions
    </a>

    <a class="menu-button" href="#">
      <div class="icon">🏠</div>
      Entry List
    </a>

    <a class="menu-button" href="#">
      <div class="icon">👤</div>
      My Account
    </a>

    <a class="menu-button" href="#">
      <div class="icon">👥</div>
      Social
    </a>

    <a class="menu-button" href="#">
      <div class="icon">⭐</div>
      Latest Winners
    </a>

    <a class="menu-button" href="#">
      <div class="icon">🎧</div>
      LIVE SUPPORT
    </a>

    <a class="menu-button" href="#">
      <div class="icon">♥</div>
      Refer a Friend
    </a>

    <a class="menu-button favourites" href="#">
      <div class="icon">♥</div>
      Favourites
    </a>

    <a class="menu-button" href="#">
      <div class="icon">🔔</div>
      Notifications
    </a>

  </div>

</div>

<div class="bottom-nav">

  <a href="#" class="nav-button">
    ←
  </a>

  <a href="#" class="nav-button home">
    🏠
  </a>

  <a href="#" class="nav-button">
    🔔
  </a>

</div>

</body>
</html>
