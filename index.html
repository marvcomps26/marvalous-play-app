<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b2a86">

  <title>Marvalous</title>
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      background:
        linear-gradient(
          180deg,
          #51227d 0%,
          #6b32a0 48%,
          #51227d 100%
        );
      padding-bottom: 30px;
      position: relative;
    }

    /* TOP */

   .top {
  padding: 18px 22px 5px;
  text-align: center;
}

.status-box {
  background: #050505;
  color: white;
  border: 2px solid white;
  border-radius: 14px;
  padding: 11px 8px;
  font-size: 17px;
  font-weight: 800;
  box-shadow: 0 3px 8px rgba(0,0,0,.22);
} 

   .logo-area {
  height: 165px;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 25px;
  text-align: center;
}

.logo {
  max-width: 270px;
  max-height: 150px;
  object-fit: contain;
}

.temporary-logo {
  display: none;
}

.rules {
  text-align: center;
  color: rgba(255,255,255,.75);
  margin: 0 0 14px;
  font-size: 15px;
}

.menu {
  padding: 0 22px 22px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.menu-button {
  height: 105px;
  min-height: 0;
  background: white;
  border: none;
  border-radius: 16px;
  color: #32154d;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 7px 5px;
  box-shadow: 0 3px 8px rgba(0,0,0,.18);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

.menu-button:active {
  transform: scale(.97);
}

.icon {
  font-size: 29px;
  line-height: 1;
  margin-bottom: 8px;
}

      
    .favourites {
      background: #080808;
      color: white;
    }

    .favourites .icon {
      color: #e44b61;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      height: 82px;
      background: #32154d;
      border-top: 1px solid rgba(255,255,255,.2);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      z-index: 100;
    }

    .nav-button {
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 32px;
    }

    .nav-button.home {
      color: #c89cff;
    }

  /* SOCIAL POP-UP */

.social-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease;
}

.social-overlay.show {
  opacity: 1;
  visibility: visible;
}

.social-panel {
  width: 100%;
  max-width: 520px;
  background: #51227d;
  border-radius: 28px 28px 0 0;
  padding: 12px 28px 35px;
  transform: translateY(100%);
  transition: transform .3s ease;
  box-shadow: 0 -5px 20px rgba(0,0,0,.25);
}

.social-overlay.show .social-panel {
  transform: translateY(0);
}

.social-handle {
  width: 55px;
  height: 5px;
  border-radius: 10px;
  background: rgba(255,255,255,.35);
  margin: 0 auto 22px;
}

.social-panel h2 {
  color: white;
  text-align: center;
  font-size: 25px;
  margin: 0 0 18px;
}

.social-panel a {
  display: flex;
  align-items: center;
  gap: 22px;
  min-height: 70px;
  color: white;
  text-decoration: none;
  font-size: 20px;
}

.social-panel a i {
  width: 38px;
  text-align: center;
  font-size: 29px;
}  
  </style>
</head>

<script>
async function updateWinnersToday() {
  try {
    const response = await fetch(
      'https://raw.githubusercontent.com/marvcomps26/marvalous-homepage-v3/refs/heads/main/live-comps.json?t=' + Date.now(),
      { cache: 'no-store' }
    );

    const data = await response.json();

    if (data.todaysWinnerCount !== null && data.todaysWinnerCount !== undefined) {
      document.getElementById('todayWinners').textContent =
        data.todaysWinnerCount;
    }
  } catch (error) {
    console.log('Could not update winners count');
  }
}

updateWinnersToday();

setInterval(updateWinnersToday, 30000);
</script>

<!-- SOCIAL PANEL -->
<div id="socialOverlay" class="social-overlay" onclick="closeSocial(event)">

  <div class="social-panel">

    <div class="social-handle"></div>

    <h2>Follow Us</h2>

    <a href="https://www.facebook.com/share/1EojaTRH2G/">
      <i class="fa-brands fa-facebook"></i>
      Facebook
    </a>

    <a href="https://www.instagram.com/marvalous.competitions?stkn=MWVnZ3Nxdm54OHdrNQ==">
      <i class="fa-brands fa-instagram"></i>
      Instagram
    </a>

    <a href="https://www.tiktok.com/@marvalous_competitionsuk">
      <i class="fa-brands fa-tiktok"></i>
      TikTok
    </a>

  </div>

</div>

<script>
function openSocial(event) {
  event.preventDefault();
  document.getElementById('socialOverlay').classList.add('show');
}

function closeSocial(event) {
  if (event.target.id === 'socialOverlay') {
    document.getElementById('socialOverlay').classList.remove('show');
  }
}
</script>
  
<body>

<div class="app">

  <div class="top">

> 

  </div>

  </div>

<div class="menu">

<a class="menu-button" href="winners.html">

</a>

</div>
