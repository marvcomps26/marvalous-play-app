<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#51227d">

  <title>Marvalous</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: white;
    }

    .browser {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 68px;
    }

    .browser iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: #51227d;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      z-index: 1000;
      box-shadow: 0 -2px 8px rgba(0,0,0,.18);
    }

    .nav-button {
      height: 68px;
      border: 0;
      background: transparent;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 25px;
      cursor: pointer;
    }

    .nav-button.home {
      color: #d8b5ff;
    }

    .nav-button:active {
      background: rgba(255,255,255,.08);
    }
  </style>
</head>

<body>

  <div class="browser">
    <iframe id="webFrame" title="Marvalous"></iframe>
  </div>

  <nav class="bottom-nav">

    <button class="nav-button" onclick="goBack()" aria-label="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <a class="nav-button home" href="index.html" aria-label="App Home">
      <i class="fa-solid fa-house"></i>
    </a>

    <a class="nav-button" href="index.html#notifications" aria-label="Notifications">
      <i class="fa-solid fa-bell"></i>
    </a>

  </nav>

  <script>
    const params = new URLSearchParams(window.location.search);
    const requestedPage = params.get('page');

    const allowedPages = {
      competitions: 'https://marvalouscompetitions.co.uk/',
      lists: 'https://marvalouscompetitions.co.uk/lists',
      account: 'https://marvalouscompetitions.co.uk/account/settings'
    };

    const frame = document.getElementById('webFrame');

    frame.src =
      allowedPages[requestedPage] ||
      'https://marvalouscompetitions.co.uk/';

    function goBack() {
      try {
        frame.contentWindow.history.back();
      } catch (error) {
        window.location.href = 'index.html';
      }
    }
  </script>

</body>
</html>
