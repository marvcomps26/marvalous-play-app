<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#51227d">

  <title>Notifications</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="app-nav.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6fa;
      color: #333;
    }

    .header {
      height: 62px;
      background: #51227d;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 22px;
    }

    .header a {
      color: white;
      text-decoration: none;
      font-size: 21px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
    }

    .page-title {
      background: #51227d;
      color: white;
      text-align: center;
      padding: 30px 20px 38px;
      font-size: 26px;
      font-weight: 800;
    }

    .notification-list {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
    }

    .notification {
      background: white;
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      box-shadow: 0 2px 7px rgba(0,0,0,.08);
    }

    .notification-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      background: #51227d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

 .notification-content {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  overflow-wrap: anywhere;
 }

    .notification-title {
      color: #32154d;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .notification-message {
      color: #555;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }

    .notification-time {
      color: #999;
      font-size: 12px;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 60px 20px;
      font-size: 15px;
    }
  </style>
</head>

<body class="has-bottom-nav">

  <header class="header">
    <a href="index.html" aria-label="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="header-title">Notifications</div>
  </header>

  <div class="page-title">
    Latest Updates
  </div>

  <main id="notificationList" class="notification-list">

    <div class="empty">
      Your Marvalous notifications will appear here.
    </div>

  </main>

  <nav class="bottom-nav">

    <button class="nav-button" onclick="history.back()" aria-label="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <a class="nav-button home" href="index.html" aria-label="Home">
      <i class="fa-solid fa-house"></i>
    </a>

    <a class="nav-button" href="notifications.html" aria-label="Notifications">
      <i class="fa-solid fa-bell"></i>
    </a>

  </nav>

 <script>
async function loadNotifications() {
  const list = document.getElementById('notificationList');

  try {
    const response = await fetch(
      'notifications.json?t=' + Date.now(),
      { cache: 'no-store' }
    );

    const data = await response.json();
    const notifications = data.notifications || [];

    if (notifications.length === 0) {
      list.innerHTML = `
        <div class="empty">
          Your Marvalous notifications will appear here.
        </div>
      `;
      return;
    }

    list.innerHTML = '';

    notifications.forEach(item => {
      const notification = document.createElement('div');
      notification.className = 'notification';

      notification.innerHTML = `
        <div class="notification-icon">
          <i class="fa-solid fa-bell"></i>
        </div>

        <div class="notification-content">
          <div class="notification-title">${item.title || ''}</div>
          <div class="notification-message">${item.message || ''}</div>
          <div class="notification-time">${item.time || ''}</div>
        </div>
      `;

      list.appendChild(notification);
    });

  } catch (error) {
    list.innerHTML = `
      <div class="empty">
        Your Marvalous notifications will appear here.
      </div>
    `;
  }
}

loadNotifications();
 </script> 
</body>
</html>
