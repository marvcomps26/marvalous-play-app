<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#51227d">

  <title>Notifications</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="app-nav.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6fa;
      color: #333;
    }

    .header {
      height: 62px;
      background: #51227d;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 22px;
    }

    .header a {
      color: white;
      text-decoration: none;
      font-size: 21px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
    }

    .page-title {
      background: #51227d;
      color: white;
      text-align: center;
      padding: 30px 20px 38px;
      font-size: 26px;
      font-weight: 800;
    }

    .clear-notifications {
  display: block;
  margin: 14px auto 0;
  padding: 8px 18px;
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 20px;
  background: transparent;
  color: white;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.clear-notifications:active {
  background: rgba(255,255,255,.15);
}

.clear-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 25px;
  z-index: 9999;
}

.clear-modal.show {
  display: flex;
}

.clear-modal-box {
  width: 100%;
  max-width: 340px;
  background: white;
  border-radius: 22px;
  padding: 28px 24px 22px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0, 0, 0, .3);
}

.clear-modal-icon {
  width: 58px;
  height: 58px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: #51227d;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

.clear-modal-title {
  color: #32154d;
  font-size: 21px;
  font-weight: 800;
  margin-bottom: 8px;
}

.clear-modal-text {
  color: #666;
  font-size: 14px;
  line-height: 1.45;
  margin-bottom: 22px;
}

.clear-modal-actions {
  display: flex;
  gap: 10px;
}

.clear-modal-actions button {
  flex: 1;
  height: 44px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

.modal-cancel {
  background: #f1edf5;
  color: #51227d;
  border: 0;
}

.modal-clear {
  background: #51227d;
  color: white;
  border: 0;
}    

    .notification-list {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
    }

    .notification {
      background: white;
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      box-shadow: 0 2px 7px rgba(0,0,0,.08);
    }

    .notification-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      background: #51227d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

 .notification-content {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  overflow-wrap: anywhere;
 }

    .notification-title {
      color: #32154d;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .notification-message {
      color: #555;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }

    .notification-time {
      color: #999;
      font-size: 12px;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 60px 20px;
      font-size: 15px;
    }
  </style>
</head>

<body class="has-bottom-nav">

  <header class="header">
    <a href="index.html" aria-label="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="header-title">Notifications</div>
  </header>

  <div class="page-title">
  Latest Updates

  <button id="clearNotificationsButton" class="clear-notifications">
    Clear all
  </button>
</div>

  <div id="clearModal" class="clear-modal">
  <div class="clear-modal-box">
    <div class="clear-modal-icon">
      <i class="fa-solid fa-bell-slash"></i>
    </div>

    <div class="clear-modal-title">
      Clear notifications?
    </div>

    <div class="clear-modal-text">
      This will remove all notifications from your list.
    </div>

    <div class="clear-modal-actions">
      <button id="cancelClearButton" class="modal-cancel">
        Cancel
      </button>

      <button id="confirmClearButton" class="modal-clear">
        Clear all
      </button>
    </div>
  </div>
</div>
  <main id="notificationList" class="notification-list">

    <div class="empty">
      Your Marvalous notifications will appear here.
    </div>

  </main>

  <nav class="bottom-nav">

    <button class="nav-button" onclick="history.back()" aria-label="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <a class="nav-button home" href="index.html" aria-label="Home">
      <i class="fa-solid fa-house"></i>
    </a>

  <a class="nav-button active" href="notifications.html" aria-label="Notifications">
  <i class="fa-solid fa-bell"></i>
  </a>

  </nav>

 <script>
   function formatNotificationTime(time) {
  if (!time) return '';

  const date = new Date(time);

  return date.toLocaleString('en-GB', {
    day: 'numeric',
    month: 'short',
    hour: 'numeric',
    minute: '2-digit',
    hour12: true,
    timeZone: 'Europe/London'
  }).replace(',', ' ·');
   }
async function loadNotifications() {
  const list = document.getElementById('notificationList');

  try {
   const response = await fetch(
  'https://marvalous-notifications.marvalouscompetitions.workers.dev/?t=' + Date.now(),
  { cache: 'no-store' }
);

  const data = await response.json();

const clearedAt =
  localStorage.getItem('marvalousNotificationsClearedAt');

const notifications = (data.notifications || []).filter(item => {
  if (!clearedAt) return true;
  if (!item.time) return false;

  return new Date(item.time).getTime() >
    new Date(clearedAt).getTime();
});
    if (notifications.length > 0 && notifications[0].id) {
  localStorage.setItem(
    'marvalousLastReadNotificationId',
    notifications[0].id
  );
}

    if (notifications.length === 0) {
      list.innerHTML = `
        <div class="empty">
          Your Marvalous notifications will appear here.
        </div>
      `;
      return;
    }

    list.innerHTML = '';

    notifications.forEach(item => {
      const notification = document.createElement('div');
      notification.className = 'notification';

      notification.innerHTML = `
        <div class="notification-icon">
          <i class="fa-solid fa-bell"></i>
        </div>

        <div class="notification-content">
          <div class="notification-title">${item.title || ''}</div>
          <div class="notification-message">${item.message || ''}</div>
          <div class="notification-time">${formatNotificationTime(item.time)}</div>
        </div>
      `;

      list.appendChild(notification);
    });

  } catch (error) {
    list.innerHTML = `
      <div class="empty">
        Your Marvalous notifications will appear here.
      </div>
    `;
  }
}

const clearModal = document.getElementById('clearModal');
const clearButton = document.getElementById('clearNotificationsButton');
const cancelClearButton = document.getElementById('cancelClearButton');
const confirmClearButton = document.getElementById('confirmClearButton');

clearButton.addEventListener('click', () => {
  clearModal.classList.add('show');
});

cancelClearButton.addEventListener('click', () => {
  clearModal.classList.remove('show');
});

clearModal.addEventListener('click', (event) => {
  if (event.target === clearModal) {
    clearModal.classList.remove('show');
  }
});

confirmClearButton.addEventListener('click', () => {
  localStorage.setItem(
    'marvalousNotificationsClearedAt',
    new Date().toISOString()
  );

  document.getElementById('notificationList').innerHTML = `
    <div class="empty">
      Your Marvalous notifications will appear here.
    </div>
  `;

  clearModal.classList.remove('show');
});

loadNotifications();
  
 </script> 
</body>
</html>
