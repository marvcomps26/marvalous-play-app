name: Update Instant Winners

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: instant-winners-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scrape instant winners
        run: node scrape-winners.mjs

      - name: Save updated winners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add instant-winners.json

          if git diff --cached --quiet; then
            echo "No winner changes to save."
            exit 0
          fi

          git commit -m "Update instant winners"

          git pull --rebase origin main
          git push origin main
