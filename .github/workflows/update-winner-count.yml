name: Update Winner Count

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-winner-count
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scrape winner count
        run: node scrape-winner-count.mjs

      - name: Save winner count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add winner-count.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update instant winner count"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "Winner count updated successfully"
              exit 0
            fi

            echo "Push collided with another update. Retrying..."
            sleep 5
          done

          echo "Could not push after 5 attempts"
          exit 1
