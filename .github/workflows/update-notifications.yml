name: Update Notification History

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OneSignal notifications
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          curl --fail --silent --show-error \
            --request GET \
            --url "https://api.onesignal.com/notifications?app_id=53bd206e-20f6-417e-8d73-ce10ee3b1b3a&limit=50" \
            --header "Authorization: Key $ONESIGNAL_REST_API_KEY" \
            --header "accept: application/json" \
            --output onesignal-response.json

      - name: Build notification history
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("onesignal-response.json", "utf8")
          );

          const notifications = (data.notifications || [])
            .filter(item => item.completed_at || item.queued_at)
            .map(item => {
              const title =
                item.headings?.en ||
                item.name ||
                "Marvalous Competitions";

              const message =
                item.contents?.en ||
                "";

              const timestamp =
                item.completed_at ||
                item.queued_at;

              return {
                title,
                message,
                time: timestamp
                  ? new Date(timestamp * 1000).toISOString()
                  : ""
              };
            });

          fs.writeFileSync(
            "notifications.json",
            JSON.stringify({ notifications }, null, 2) + "\n"
          );
          NODE

      - name: Remove temporary OneSignal response
        run: rm -f onesignal-response.json

      - name: Save notification history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifications.json
          git diff --cached --quiet || git commit -m "Update notification history"
          git push
